# Multi-dataset training configuration
# This config allows training on multiple datasets simultaneously
# The datasets will be unified into a common channel space

well_base_path: "/Users/divyam/Course/Project Arbeit/the_well/datasets/"

# Training datasets - listed here will be combined during training
train_datasets:
  - turbulent_radiative_layer_2D
  - active_matter

# Validation datasets - for validation during training
val_datasets:
  - turbulent_radiative_layer_2D
  - active_matter

# Test datasets - for final testing/evaluation
test_datasets:
  - helmholtz_staircase

# Dataset parameters
batch_size: 8
n_steps_input: 4
n_steps_output: 1
target_hw: [128, 384]

# Normalization
use_normalization: True
min_dt_stride: 1
max_dt_stride: 1

# Data loading
data_workers: 8

# Model parameters
init_features: 48
cond_channels: 16
emb_dim: 384

# Training parameters
lr: 0.01
epochs: 20
